<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock Offer</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #6a00ff, #ff008c);
}

/* Container */
.container {
  text-align: center;
}

/* Image Animation */
.offer-img {
  width: 320px;
  max-width: 90%;
  border-radius: 15px;
  animation: floatZoom 4s ease-in-out infinite;
}

/* Combined Animation */
@keyframes floatZoom {
  0% {
    transform: translateY(0px) scale(1);
  }
  50% {
    transform: translateY(-12px) scale(1.05);
  }
  100% {
    transform: translateY(0px) scale(1);
  }
}

/* Button */
.btn {
  margin-top: 25px;
  padding: 16px 35px;
  font-size: 18px;
  background: linear-gradient(45deg, orange, gold);
  color: white;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  animation: glow 1.5s infinite alternate;
}

/* Glow Effect */
@keyframes glow {
  from {
    box-shadow: 0 0 10px orange;
  }
  to {
    box-shadow: 0 0 25px yellow;
  }
}

.btn:active {
  transform: scale(0.95);
}
</style>

</head>

<body>

<div class="container">

  <!-- তোমার দেওয়া ছবি এখানে বসাও -->
  <img src="1.jpg" alt="Offer" class="offer-img">

  <!-- Button -->
  <button class="btn" onclick="unlockOffer()">🔓 Unlock Your Offer</button>

</div>

<script>
function unlockOffer() {
  window.location.href = "https://www.profitablecpmratenetwork.com/dm4gw84y?key=2da600bcada0b96982eb1758e7c12b8d"; // এখানে তোমার নতুন পেজের নাম দাও
}
</script>

</body>
</html>
